version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: sistema-camaras-api
    env_file: .env
    environment:
      DATABASE_PATH: /app/data/camaras.db
    # Solo esta PC puede pegarle directo al puerto de la API (para debug/curl
    # local). El resto de la LAN tiene que entrar por nginx (8088), que es el
    # único lugar donde la IP del cliente no se puede falsificar — nginx
    # siempre pisa X-Forwarded-For con la IP real, pero si la API quedara
    # expuesta a toda la red, cualquiera podría pegarle directo a ella y
    # mandar ese header con lo que quiera para saltarse restringirRedLocal.
    # El puerto interno del contenedor sigue siendo 3001 (ver PORT en .env);
    # solo cambia el puerto por el que se lo ve desde el host/afuera.
    ports:
      - "127.0.0.1:3088:3001"
    volumes:
      - ./backend:/app
      - /app/node_modules
      # Bind mount (no volumen con nombre) a propósito: así camaras.db queda
      # como un archivo real en backend/data/, visible desde Windows, y se
      # puede abrir con SQLTools/DB Browser sin tener que copiarlo afuera de
      # Docker cada vez.
      - ./backend/data:/app/data
    networks:
      - sistema-camaras-network
    # Corre las migraciones pendientes y el alta del admin inicial antes de
    # levantar la API — ambos son idempotentes, así que es seguro en cada
    # arranque (ver src/migrate.js y src/seedAdmin.js).
    command: sh -c "npm run migrate:up && npm run seed:admin && npm start"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: sistema-camaras-frontend
    ports:
      - "8088:80"
    depends_on:
      - api
    networks:
      - sistema-camaras-network

networks:
  sistema-camaras-network:
    driver: bridge
