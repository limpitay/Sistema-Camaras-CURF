events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss;

    server {
        listen 80;
        server_name localhost;

        root /usr/share/nginx/html;
        index index.html index.htm;

        # Archivos estáticos con tipos MIME correctos
        location ~* \.js$ {
            add_header Content-Type application/javascript;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        location ~* \.css$ {
            add_header Content-Type text/css;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        location ~* \.(svg|woff|woff2|ttf|eot|png|jpg|jpeg)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # React SPA - servir index.html para todas las rutas
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache";
        }

        # Proxy al API. ^~ fuerza que esto gane sobre las reglas regex de abajo
        # (si no, una imagen subida en /api/uploads/... con extensión .jpg caía
        # en la regla de cache de imágenes estáticas del frontend y nunca
        # llegaba a proxearse — las regex normales tienen prioridad sobre un
        # prefix location plano, ^~ es lo que invierte eso).
        location ^~ /api/ {
            proxy_pass http://api:3001;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            # IP real del cliente — sin esto el backend solo ve la IP interna
            # de este contenedor y no puede restringir el acceso por LAN.
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
